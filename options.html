<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Copy URL & Title Options</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            max-width: 600px;
        }

        h1 {
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 8px;
            font-family: monospace;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .help-text {
            font-size: 0.9em;
            color: #666;
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 4px;
            margin-top: 5px;
        }

        code {
            background: #eee;
            padding: 2px 4px;
            border-radius: 3px;
        }

        button {
            padding: 8px 16px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1557b0;
        }

        #status {
            margin-top: 10px;
            color: #0b8043;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
</head>

<body>

    <h1>Options</h1>

    <div class="form-group">
        <label for="format">Copy Format:</label>
        <textarea id="format"></textarea>
        <div class="help-text">
            <strong>Available Placeholders:</strong>
            <ul>
                <li><code>${Title}</code> - Page Title</li>
                <li><code>${URL}</code> - Page URL</li>
                <li><code>${OG:Title}</code> - Open Graph Title</li>
                <li><code>${OG:Description}</code> - Open Graph Description</li>
                <li><code>${Meta:Description}</code> - Meta Description</li>
            </ul>
        </div>
    </div>

    <button id="save">Save</button>
    <div id="status">Options saved.</div>

    <script src="options.js"></script>
</body>

</html>
